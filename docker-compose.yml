version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erpv3
      POSTGRES_USER: erpv3
      POSTGRES_PASSWORD: erpv3
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: erpv3
      DB_PASSWORD: erpv3
      DB_NAME: erpv3
      JWT_SECRET: change_me
    ports:
      - "3000:3000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    ports:
      - "5173:5173"
volumes:
  db_data:
